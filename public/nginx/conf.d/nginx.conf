server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    server_name seterlab.no;

    http2 on;

    ssl_certificate     /etc/letsencrypt/live/seterlab.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seterlab.no/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    limit_req zone=perip burst=40 nodelay;

    root /usr/share/nginx/html;
}

server {
    listen 443 ssl;
    server_name rental.seterlab.no;

    http2 on;

    ssl_certificate     /etc/letsencrypt/live/rental.seterlab.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rental.seterlab.no/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 10m;
    limit_req zone=perip burst=40 nodelay;

    location = / {
        return 302 /home;
    }

    location /api/ {
        set $upstream http://rental-api:8080;
        include conf.d/proxy_headers.inc;
        proxy_pass $upstream;
    }

    location / {
        set $upstream http://rental-web:3000;
        include conf.d/proxy_headers.inc;
        proxy_pass $upstream;
    }
}


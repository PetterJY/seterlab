<svg xmlns="http://www.w3.org/2000/svg" width="720" height="660" viewBox="0 0 720 660" role="img" aria-labelledby="title desc">
  <title id="title">Seterlab architecture</title>
  <desc id="desc">Devices on the tailnet reach Seterlab through a Tailscale WireGuard tunnel. On the server, ufw lets the traffic through to one Nginx container, which ends TLS for *.seterlab.no and passes requests over plain HTTP to service containers on per-stack Podman networks. The containers keep their data on an NVMe and an HDD through bind mounts.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d1d9e0; }
    .panel { fill: #f6f8fa; stroke: #d1d9e0; }
    .blue { fill: #ddf4ff; stroke: #54aeff; }
    .green { fill: #dafbe1; stroke: #4ac26b; }
    .purple { fill: #fbefff; stroke: #c297ff; }
    .orange { fill: #fff1e5; stroke: #fb8f44; }
    .chip { fill: #ffffff; stroke: #c297ff; }
    .gate { fill: #ffffff; stroke: #818b98; }
    .line { stroke: #818b98; fill: none; stroke-width: 1.5; }
    .dots { stroke: #818b98; fill: none; stroke-width: 1.5; stroke-dasharray: 2 4; stroke-linecap: round; }
    .head { fill: #818b98; }
    .icon { fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .i-blue { stroke: #0969da; } .i-green { stroke: #1a7f37; } .i-orange { stroke: #bc4c00; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .h { font-size: 16px; font-weight: 600; }
    .b { font-size: 14px; font-weight: 600; }
    .m { font-size: 13px; fill: #59636e; }
    .s { font-size: 12px; fill: #59636e; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 12.5px; fill: #59636e; }
    
      .bg { fill: #0d1117; stroke: #3d444d; }
      .panel { fill: #151b23; stroke: #3d444d; }
      .blue { fill: #0f2340; stroke: #1f6feb; }
      .green { fill: #0f2a1b; stroke: #238636; }
      .purple { fill: #231a3a; stroke: #8957e5; }
      .orange { fill: #2c1a0e; stroke: #bd561d; }
      .chip { fill: #0d1117; stroke: #8957e5; }
      .gate { fill: #0d1117; stroke: #656c76; }
      .line, .dots { stroke: #656c76; }
      .head { fill: #656c76; }
      .i-blue { stroke: #4493f8; } .i-green { stroke: #3fb950; } .i-orange { stroke: #db6d28; }
      text { fill: #f0f6fc; }
      .m, .s, .mono { fill: #9198a1; }
    
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="719" height="659" rx="12"/>

  <!-- Devices -->
  <rect class="blue" x="210" y="40" width="300" height="44" rx="22"/>
  <g class="icon i-blue">
    <rect x="234" y="54" width="20" height="13" rx="2"/>
    <path d="M230 71 h28"/>
    <rect x="263" y="52" width="11" height="19" rx="2.5"/>
    <path d="M267 67.5 h3"/>
  </g>
  <text class="b" x="290" y="67">Devices on the tailnet</text>

  <path class="line" d="M360 84 V114" marker-end="url(#arrow)"/>

  <!-- Tailscale -->
  <rect class="blue" x="40" y="118" width="640" height="44" rx="10"/>
  <g class="icon i-blue">
    <path d="M70 129 l9 3.5 v7 c0 5.5 -4 9 -9 11 c-5 -2 -9 -5.5 -9 -11 v-7 z"/>
    <path d="M66.5 139.5 l2.5 2.5 l4.5 -5"/>
  </g>
  <text x="92" y="145"><tspan class="b">Tailscale</tspan><tspan class="m" dx="8">WireGuard tunnel, checked against the access policy</tspan></text>

  <path class="line" d="M360 162 V190" marker-end="url(#arrow)"/>
  <text class="mono" x="372" y="183">&lt;service&gt;.seterlab.no</text>

  <!-- Host -->
  <rect class="panel" x="40" y="204" width="640" height="432" rx="12"/>
  <text class="h" x="64" y="236">Seterlab</text>
  <text class="m" x="64" y="255">Ubuntu Server</text>
  <text class="m" x="656" y="236" text-anchor="end">rootless Podman, run by systemd</text>

  <rect class="gate" x="334" y="194" width="52" height="22" rx="6"/>
  <text class="s" x="360" y="209.5" text-anchor="middle">ufw</text>
  <path class="line" d="M360 216 V272" marker-end="url(#arrow)"/>

  <!-- Nginx -->
  <rect class="green" x="80" y="276" width="560" height="64" rx="10"/>
  <g class="icon i-green">
    <rect x="98" y="301" width="16" height="12" rx="2.5"/>
    <path d="M101.5 301 v-4 a4.5 4.5 0 0 1 9 0 v4"/>
  </g>
  <text class="b" x="128" y="302">Nginx container</text>
  <text class="m" x="128" y="322">ports 80 and 443 · wildcard TLS for *.seterlab.no</text>

  <path class="line" d="M166 340 V380" marker-end="url(#arrow)"/>
  <path class="line" d="M360 340 V380" marker-end="url(#arrow)"/>
  <path class="line" d="M554 340 V380" marker-end="url(#arrow)"/>
  <text class="s" x="176" y="365">HTTP by container name</text>

  <!-- Stack networks -->
  <g>
    <rect class="purple" x="80" y="384" width="172" height="80" rx="10" stroke-dasharray="5 3"/>
    <text class="s" x="94" y="405">stack network</text>
    <rect class="chip" x="94" y="418" width="68" height="30" rx="7"/>
    <text class="m" x="128" y="437.5" text-anchor="middle">service</text>
    <rect class="chip" x="170" y="418" width="68" height="30" rx="7"/>
    <text class="m" x="204" y="437.5" text-anchor="middle">service</text>
  </g>
  <g>
    <rect class="purple" x="274" y="384" width="172" height="80" rx="10" stroke-dasharray="5 3"/>
    <text class="s" x="288" y="405">stack network</text>
    <rect class="chip" x="326" y="418" width="68" height="30" rx="7"/>
    <text class="m" x="360" y="437.5" text-anchor="middle">service</text>
  </g>
  <g>
    <rect class="purple" x="468" y="384" width="172" height="80" rx="10" stroke-dasharray="5 3"/>
    <text class="s" x="482" y="405">stack network</text>
    <rect class="chip" x="482" y="418" width="68" height="30" rx="7"/>
    <text class="m" x="516" y="437.5" text-anchor="middle">service</text>
    <rect class="chip" x="558" y="418" width="68" height="30" rx="7"/>
    <text class="m" x="592" y="437.5" text-anchor="middle">service</text>
  </g>

  <!-- Bind mounts -->
  <path class="dots" d="M166 466 V494 M360 466 V494 M554 466 V494 M166 494 H554"/>
  <path class="line" d="M360 494 V516" marker-end="url(#arrow)"/>
  <text class="s" x="372" y="510">bind mounts</text>

  <!-- Storage -->
  <rect class="orange" x="80" y="520" width="560" height="84" rx="10"/>
  <g class="icon i-orange">
    <ellipse cx="164" cy="548" rx="12" ry="4"/>
    <path d="M152 548 v22 a12 4 0 0 0 24 0 v-22"/>
    <path d="M152 559 a12 4 0 0 0 24 0"/>
    <ellipse cx="466" cy="548" rx="12" ry="4"/>
    <path d="M454 548 v22 a12 4 0 0 0 24 0 v-22"/>
    <path d="M454 559 a12 4 0 0 0 24 0"/>
  </g>
  <text class="b" x="190" y="557">NVMe</text>
  <text class="m" x="190" y="577">system, images, app data</text>
  <text class="b" x="492" y="557">HDD</text>
  <text class="m" x="492" y="577">bulk data</text>
</svg>

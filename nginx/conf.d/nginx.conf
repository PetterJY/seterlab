ssl_certificate     /etc/letsencrypt/live/seterlab.no/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/seterlab.no/privkey.pem;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
  listen 80 default_server;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name seterlab.no;
    return 301 https://homepage.seterlab.no;
}

server {
    listen 443 ssl;
    
    server_name homepage.seterlab.no;

    location / {
        include conf.d/proxy_headers.inc;
        proxy_pass http://homepage:3000;
    }
}

server {
    listen 443 ssl;
    
    server_name jellyfin.seterlab.no;

    location / {
        include conf.d/proxy_headers.inc;
        proxy_pass http://jellyfin:8096;

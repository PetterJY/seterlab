server {
    listen 443 ssl;
    
    server_name crafty.seterlab.no;

    client_max_body_size 1G;      
    proxy_request_buffering off; 
    proxy_read_timeout 300s;    
    proxy_send_timeout 300s;

    location / {
        include conf.d/proxy_headers.inc;
        proxy_pass https://10.90.0.10:8443; # Crafty Container's static IP
    }
}

server {
    listen 443 ssl;
    
    server_name flybymedia.seterlab.no;

    location / {
        include conf.d/proxy_headers.inc;
        proxy_pass http://flybymedia:3000;
    }
}

server {
    listen 443 ssl;
    server_name rental.seterlab.no;

    location = / {
        return 302 /home;
    }

    location /api/ {
        include conf.d/proxy_headers.inc;
        proxy_pass http://rental-api:8080;
    }

    location / {
        include conf.d/proxy_headers.inc;
        proxy_pass http://rental-web:3000;
    }
}
